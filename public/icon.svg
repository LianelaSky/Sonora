<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fa2d48" />
      <stop offset="50%" stop-color="#fb5e74" />
      <stop offset="100%" stop-color="#c01530" />
    </linearGradient>
    <linearGradient id="note-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0f0f5" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Windows 11 Fluent App Icon Base -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" filter="url(#shadow)" />

  <!-- Subtle Mica / Glass Inner Rim -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="4" />

  <!-- Apple Music Style Double Eighth Note -->
  <g fill="url(#note-grad)">
    <!-- Left Note Head -->
    <ellipse cx="176" cy="360" rx="46" ry="34" transform="rotate(-22 176 360)" />
    <!-- Right Note Head -->
    <ellipse cx="336" cy="312" rx="46" ry="34" transform="rotate(-22 336 312)" />
    <!-- Left Stem -->
    <rect x="206" y="160" width="18" height="196" rx="9" />
    <!-- Right Stem -->
    <rect x="366" y="112" width="18" height="196" rx="9" />
    <!-- Horizontal Cross Beam with Slope -->
    <path d="M 206 168 L 384 120 L 384 156 L 206 204 Z" />
  </g>
</svg>
